name: Build Google SDK APK

# Builds the duckduckgo-android fork with Google Ads (AdMob) only, on the
# google-sdk branch. Manual trigger only.
# Release signing uses this fork's own keystore (GitHub Secrets:
# RELEASE_KEYSTORE base64, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS,
# RELEASE_KEY_PASSWORD). Upstream's release signingConfig reads the
# properties file below, so no build.gradle change is needed.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_google_sdk_apk:
    name: Build Google SDK apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK version
        uses: actions/setup-java@v6
        with:
          java-version-file: .github/.java-version
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Prepare release signing
        # Writes the fork's own keystore + properties where upstream's
        # release signingConfig expects them ($HOME/jenkins_static/...).
        # If any RELEASE_* secret is missing, the build still runs but the
        # APK comes out unsigned.
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          mkdir -p "$HOME/jenkins_static/com.duckduckgo.mobile.android"
          cd "$HOME/jenkins_static/com.duckduckgo.mobile.android"
          if [ -n "$RELEASE_KEYSTORE" ]; then
            echo "$RELEASE_KEYSTORE" | base64 -d > release.keystore
            cat > ddg_android_build.properties <<EOF
          key.store=release.keystore
          key.store.password=$RELEASE_STORE_PASSWORD
          key.alias=$RELEASE_KEY_ALIAS
          key.alias.password=$RELEASE_KEY_PASSWORD
          EOF
            echo "Release signing configured."
          else
            echo "RELEASE_KEYSTORE secret missing, APK will be unsigned."
          fi

      - name: Assemble Play release apk
        # Play flavor: AdMob is a plain `implementation` dependency, so it is
        # present in every flavor; Play is the variant users install.
        # -PabortOnError=false keeps lint findings from failing the build.
        # -PuseProprietaryFont=false is required: PlayRelease builds refuse to
        # run without the proprietary DuckSans font credentials, and this fork
        # has none — the fallback placeholder fonts are used instead.
        run: ./gradlew assemblePlayRelease -PabortOnError=false -PuseProprietaryFont=false

      - name: Upload Play release apk
        uses: actions/upload-artifact@v4
        with:
          name: duckduckgo-google-sdk-play-release
          path: app/build/outputs/apk/play/release/*.apk
          if-no-files-found: error
